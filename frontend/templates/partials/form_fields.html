{% for field in form %}
    <div class="form-field{% if field.errors %} has-error{% endif %}">
        {{ field.label_tag }}
        {{ field }}
        {% if field.help_text %}<div class="field-help">{{ field.help_text|safe }}</div>{% endif %}
        {% for error in field.errors %}<p class="field-error">{{ error }}</p>{% endfor %}
    </div>
{% endfor %}
